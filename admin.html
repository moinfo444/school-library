<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#8d6aa7"><title>لوحة إدارة المكتبة الرقمية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#8d6aa7;--pd:#6d4a88;--pink:#e8a0bf;--rose:#fbeaf3;--lav:#f3ecf9;--text:#3d2b4a;--green:#238653;--red:#c0392b}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Tajawal,sans-serif;background:var(--rose);color:var(--text);min-height:100vh}
header{background:linear-gradient(135deg,#8d6aa7,#e8a0bf);color:white;padding:22px 16px;text-align:center}header h1{font-size:24px}header a{color:white;font-size:14px}
.wrap{max-width:850px;margin:24px auto;padding:0 14px}.card{background:white;border-radius:22px;padding:22px;box-shadow:0 6px 20px #8d6aa726;margin-bottom:22px}
h2{color:var(--pd);margin-bottom:14px;font-size:20px}label{display:block;margin:12px 0 5px;font-weight:700}
input,select{width:100%;padding:12px 14px;border:2px solid var(--lav);border-radius:14px;font:inherit;outline:none;background:white;color:var(--text)}input:focus,select:focus{border-color:var(--pink)}
.btn{margin-top:14px;width:100%;padding:13px;border:0;border-radius:15px;background:linear-gradient(135deg,var(--p),#c58bb8);color:white;font:inherit;font-weight:800;font-size:16px;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}
.secondary{background:#eee5f4;color:var(--pd)}.danger{background:#fff0f0;color:var(--red);border:1px solid #f1b6b6}
.msg{margin-top:12px;font-weight:700;text-align:center;overflow-wrap:anywhere}.ok{color:var(--green)}.err{color:var(--red)}
.muted,.filemeta{color:#806d8d;font-size:13px;line-height:1.7;margin-top:6px}.or{text-align:center;margin:12px 0;opacity:.65}
.row{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--lav);margin:10px 0}.info{flex:1;min-width:0}.row small{opacity:.75;display:block;overflow-wrap:anywhere}
.del{background:white;border:1px solid var(--pink);color:var(--red);border-radius:10px;padding:7px 12px;font:inherit;cursor:pointer;font-weight:700}
.bar{height:12px;background:var(--lav);border-radius:10px;overflow:hidden;margin-top:14px;display:none}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--pink));transition:width .15s}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}.out{background:none;border:0;color:var(--pd);cursor:pointer;font:inherit;text-decoration:underline}
.hide{display:none!important}.pill{padding:3px 9px;border-radius:20px;background:#eee5f4;color:var(--pd);font-size:12px;text-decoration:none}
.notice{background:#fff8e8;border:1px solid #f1d69a;padding:12px;border-radius:12px;font-size:13px;line-height:1.7;margin:12px 0}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls button{flex:1;min-width:110px}
@media(max-width:560px){.card{padding:17px}.row{align-items:flex-start}.controls{flex-direction:column}}
</style></head>
<body>
<header><h1>🔐 لوحة إدارة المكتبة الرقمية</h1><a href="index.html">← العودة للمكتبة</a></header>
<div class="wrap">
<div class="card" id="loginBox"><h2>تسجيل دخول الإدارة</h2>
<label for="email">البريد الإلكتروني</label><input id="email" type="email" dir="ltr" autocomplete="username">
<label for="pass">كلمة المرور</label><input id="pass" type="password" dir="ltr" autocomplete="current-password">
<button class="btn" id="loginBtn">دخول</button><div class="msg err" id="loginMsg" role="status"></div></div>
<div id="panel" class="hide">
<div class="card"><div class="top"><h2>➕ إضافة كتاب جديد</h2><button class="out" id="logout">تسجيل خروج</button></div>
<label for="title">عنوان الكتاب</label><input id="title" maxlength="180">
<label for="author">اسم المؤلف</label><input id="author" maxlength="140">
<label for="section">القسم</label><select id="section">
<option value="stories">قسم القصص والروايات</option><option value="science">قسم المراجع العلمية</option><option value="edu">قسم المصادر التعليمية</option><option value="culture">قسم الثقافة العامة</option></select>
<label for="provider">طريقة تخزين PDF</label><select id="provider"><option value="cloudinary">Cloudinary (خطة Firebase Spark)</option><option value="firebase" id="firebaseOption" disabled>Firebase Storage (يتطلب Blaze)</option></select>
<div class="muted" id="providerHelp">يرفع PDF إلى Cloudinary ثم يحفظ بيانات الكتاب ورابطه في Firestore.</div>
<label for="file">ملف الكتاب (PDF)</label><input id="file" type="file" accept=".pdf,application/pdf"><div class="filemeta" id="fileMeta">اختر ملف PDF من جهازك.</div>
<div class="or">— أو —</div><label for="link">رابط PDF خارجي (مثل Google Drive)</label><input id="link" type="url" dir="ltr" placeholder="https://drive.google.com/file/d/...">
<div class="bar" id="bar"><i id="barI"></i></div><div class="msg" id="uploadInfo" aria-live="polite"></div>
<div class="controls hide" id="uploadControls"><button type="button" class="btn danger" id="cancelBtn">إلغاء الرفع</button><button type="button" class="btn secondary hide" id="retryBtn">إعادة المحاولة</button></div>
<button class="btn" id="addBtn">رفع الكتاب وحفظه</button><div class="msg" id="msg" role="status"></div>
<div class="notice">لا تضع API Secret في هذا الملف مطلقاً. يُستخدم Unsigned Upload Preset فقط.</div>
</div>
<div class="card"><h2>📚 الكتب المضافة</h2><div id="list">جاري التحميل...</div></div>
</div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,addDoc,getDocs,deleteDoc,doc,query,orderBy,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getStorage,ref,uploadBytesResumable,getDownloadURL,deleteObject} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig={
 apiKey:"AIzaSyCHbn57-yguS1WfbAJuvTP1t6MIJfjqhj0",
 authDomain:"school-digital-library2.firebaseapp.com",
 projectId:"school-digital-library2",
 storageBucket:"school-digital-library2.firebasestorage.app",
 messagingSenderId:"1057904105421",
 appId:"1:1057904105421:web:139d6c16b1bf58d7cb1684"
};

/* ===== المطلوب منك: ضع اسم الـ Cloud name الخاص بحسابك هنا (من Cloudinary Dashboard) ===== */
const CLOUDINARY_CLOUD_NAME="YOUR_CLOUD_NAME";
/* اسم الـ preset الموجود عندك (Unsigned) */
const CLOUDINARY_UPLOAD_PRESET="school_library_upload";
/* ================================================================================== */

const ENABLE_FIREBASE_STORAGE=false;
const MAX_CLOUDINARY_FILE_BYTES=95*1024*1024;

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),storage=getStorage(app);
const $=id=>document.getElementById(id);
const NAMES={stories:"القصص والروايات",science:"المراجع العلمية",edu:"المصادر التعليمية",culture:"الثقافة العامة"};
let activeXhr=null,activeFirebaseTask=null,pendingAsset=null;
const formatMB=n=>(n/1048576).toFixed(2)+" MB";
const say=(t,ok=false)=>{$("msg").textContent=t;$("msg").className="msg "+(ok?"ok":"err")};
const uploadSay=t=>$("uploadInfo").textContent=t;
function resetBar(){$("bar").style.display="none";$("barI").style.width="0%"}
function friendlyError(e){
 const map={"auth/invalid-credential":"بيانات الدخول غير صحيحة. تحقق من البريد وكلمة المرور.","auth/user-not-found":"الحساب غير موجود في Firebase Authentication.","auth/wrong-password":"كلمة المرور غير صحيحة.","auth/too-many-requests":"محاولات كثيرة؛ انتظر ثم أعد المحاولة.","storage/unauthorized":"قواعد Firebase Storage لا تسمح بالرفع.","storage/canceled":"تم إلغاء الرفع.","permission-denied":"Firestore رفض حفظ البيانات؛ راجع قواعد Firestore."};
 return map[e?.code]||e?.message||"حدث خطأ غير معروف.";
}
$("loginBtn").onclick=async()=>{$("loginMsg").textContent="";$("loginBtn").disabled=true;try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("pass").value)}catch(e){console.error(e);$("loginMsg").textContent=friendlyError(e)}finally{$("loginBtn").disabled=false}};
$("pass").addEventListener("keydown",e=>{if(e.key==="Enter")$("loginBtn").click()});
$("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,user=>{$("loginBox").classList.toggle("hide",!!user);$("panel").classList.toggle("hide",!user);if(user)loadList()});
$("provider").onchange=()=>{$("providerHelp").textContent=$("provider").value==="cloudinary"?"يرفع PDF إلى Cloudinary ثم يحفظ بيانات الكتاب ورابطه في Firestore.":"Firebase Storage يدعم الإيقاف والاستكمال، ويتطلب Blaze وقواعد Storage صحيحة."};
$("file").onchange=()=>{pendingAsset=null;const f=$("file").files[0];$("fileMeta").textContent=f?`${f.name} — ${formatMB(f.size)}`:"اختر ملف PDF من جهازك.";if(f)$("link").value=""};
$("link").oninput=()=>{if($("link").value.trim()){$("file").value="";pendingAsset=null}};
function driveLinks(url){const m=url.match(/drive\.google\.com\/file\/d\/([^/]+)/)||url.match(/[?&]id=([^&]+)/);return m?{view:`https://drive.google.com/file/d/${m[1]}/preview`,dl:`https://drive.google.com/uc?export=download&id=${m[1]}`}:{view:url,dl:url}}
function validatePdf(f){if(!f)return"اختر ملف PDF.";if(!f.name.toLowerCase().endsWith(".pdf"))return"امتداد الملف يجب أن يكون PDF.";if(f.type&&f.type!=="application/pdf")return"الملف المحدد ليس PDF حسب نوعه.";if(!f.size)return"الملف فارغ.";return""}
function safeName(name){
 const base=name.replace(/\.pdf$/i,"").replace(/[^\w\-]+/g,"_").replace(/^_+|_+$/g,"").slice(0,60)||"book";
 return base;
}
function uploadCloudinary(file){return new Promise((resolve,reject)=>{
 if(CLOUDINARY_CLOUD_NAME.startsWith("YOUR_")){reject(new Error("ضع اسم Cloud Name الخاص بك في أعلى الملف (CLOUDINARY_CLOUD_NAME)."));return}
 if(file.size>MAX_CLOUDINARY_FILE_BYTES){reject(new Error("الملف أكبر من 95MB. استخدم رابط Drive أو قسّم الملف."));return}
 const xhr=new XMLHttpRequest();activeXhr=xhr;const form=new FormData();
 /* اسم فريد دائماً: يمنع استبدال ملف بآخر بنفس الاسم دون الاعتماد على إعدادات الـ preset. الامتداد .pdf مطلوب لنوع raw */
 const publicId=`${Date.now()}_${Math.random().toString(36).slice(2,8)}_${safeName(file.name)}.pdf`;
 form.append("file",file);form.append("upload_preset",CLOUDINARY_UPLOAD_PRESET);form.append("public_id",publicId);form.append("folder","school-library/books");
 xhr.open("POST",`https://api.cloudinary.com/v1_1/${encodeURIComponent(CLOUDINARY_CLOUD_NAME)}/raw/upload`);xhr.responseType="json";
 xhr.upload.onprogress=e=>{if(!e.lengthComputable)return;const p=Math.round(e.loaded/e.total*100);$("bar").style.display="block";$("barI").style.width=p+"%";uploadSay(`${p}% — ${formatMB(e.loaded)} من ${formatMB(e.total)}`)};
 xhr.onload=()=>{activeXhr=null;const r=xhr.response||{};if(xhr.status>=200&&xhr.status<300&&r.secure_url)resolve({viewUrl:r.secure_url,downloadUrl:r.secure_url,cloudinaryPublicId:r.public_id||"",cloudinaryResourceType:r.resource_type||"raw",storageProvider:"cloudinary",fileSize:file.size,fileName:file.name});else reject(new Error(r?.error?.message||xhr.getResponseHeader("X-Cld-Error")||`Cloudinary HTTP ${xhr.status}`))};
 xhr.onerror=()=>{activeXhr=null;reject(new Error("تعذر الاتصال بـ Cloudinary. تحقق من الإنترنت ومن Cloud Name واسم Upload Preset."))};
 xhr.onabort=()=>{activeXhr=null;reject(new Error("تم إلغاء الرفع."))};xhr.send(form);
})}
function uploadFirebase(file){return new Promise((resolve,reject)=>{
 if(!ENABLE_FIREBASE_STORAGE){reject(new Error("Firebase Storage غير مفعل في هذه النسخة؛ يتطلب Blaze وتغيير ENABLE_FIREBASE_STORAGE إلى true."));return}
 const safe=file.name.replace(/[^\w.\-]/g,"_"),path=`books/${Date.now()}_${safe}`;
 const task=uploadBytesResumable(ref(storage,path),file,{contentType:"application/pdf",customMetadata:{title:$("title").value.trim(),author:$("author").value.trim()}});
 activeFirebaseTask=task;$("bar").style.display="block";$("uploadControls").classList.remove("hide");
 task.on("state_changed",s=>{const p=Math.round(s.bytesTransferred/s.totalBytes*100);$("barI").style.width=p+"%";uploadSay(`${p}% — ${formatMB(s.bytesTransferred)} من ${formatMB(s.totalBytes)}${s.state==="paused"?" — متوقف مؤقتاً":""}`)},reject,async()=>{try{const url=await getDownloadURL(task.snapshot.ref);activeFirebaseTask=null;resolve({viewUrl:url,downloadUrl:url,storagePath:path,storageProvider:"firebase",fileSize:file.size,fileName:file.name})}catch(e){reject(e)}})
})}
$("cancelBtn").onclick=()=>{if(activeXhr)activeXhr.abort();if(activeFirebaseTask)activeFirebaseTask.cancel()};
$("retryBtn").onclick=()=>{$("addBtn").click()};
async function saveRecord(asset){
 const title=$("title").value.trim(),author=$("author").value.trim(),section=$("section").value,link=$("link").value.trim();
 if(!title)throw new Error("أدخل عنوان الكتاب.");
 const data={title,author,section,createdAt:serverTimestamp()};
 if(asset)Object.assign(data,asset);else if(link){const l=driveLinks(link);data.viewUrl=l.view;data.downloadUrl=l.dl;data.storageProvider="external"}else throw new Error("لا يوجد ملف أو رابط.");
 await addDoc(collection(db,"books"),data);
}
$("addBtn").onclick=async()=>{
 if(!auth.currentUser)return say("سجل الدخول أولاً.");
 const file=$("file").files[0],link=$("link").value.trim();
 if(!$("title").value.trim())return say("أدخل عنوان الكتاب.");
 if(!file&&!link&&!pendingAsset)return say("اختر PDF أو أدخل رابطاً.");
 if(file){const err=validatePdf(file);if(err)return say(err)}
 $("addBtn").disabled=true;$("retryBtn").classList.add("hide");$("uploadControls").classList.remove("hide");say("");
 try{
  let asset=pendingAsset;
  if(file&&!asset){uploadSay("بدء رفع الملف...");asset=$("provider").value==="firebase"?await uploadFirebase(file):await uploadCloudinary(file);pendingAsset=asset}
  await saveRecord(asset);pendingAsset=null;say("✅ تم رفع الكتاب وحفظ بياناته بنجاح.",true);uploadSay("اكتملت العملية.");
  $("title").value="";$("author").value="";$("file").value="";$("link").value="";$("fileMeta").textContent="اختر ملف PDF من جهازك.";
  resetBar();$("uploadControls").classList.add("hide");await loadList();
 }catch(e){
  console.error(e);say("تعذر إكمال العملية: "+friendlyError(e));
  if(pendingAsset){uploadSay("تم رفع الملف لكن تعذر حفظ بياناته في Firestore. اضغط الزر مرة أخرى لحفظ البيانات دون إعادة الرفع.")}
  else{resetBar();uploadSay("");if(file)$("retryBtn").classList.remove("hide")}
 }
 finally{$("addBtn").disabled=false;activeXhr=null;activeFirebaseTask=null}
};
async function loadList(){
 $("list").textContent="جاري تحميل الكتب...";
 try{
  const snap=await getDocs(query(collection(db,"books"),orderBy("createdAt","desc")));
  if(snap.empty){$("list").textContent="لا توجد كتب بعد.";return}
  $("list").innerHTML="";
  snap.forEach(d=>{
   const b=d.data(),row=document.createElement("div");row.className="row";
   const info=document.createElement("div");info.className="info";const title=document.createElement("b");title.textContent=b.title||"كتاب بلا عنوان";
   const small=document.createElement("small");small.textContent=(NAMES[b.section]||"قسم غير محدد")+(b.author?" — "+b.author:"")+(b.storageProvider?" — "+b.storageProvider:"");info.append(title,small);
   const open=document.createElement("a");open.href=b.viewUrl||b.downloadUrl||"#";open.target="_blank";open.rel="noopener noreferrer";open.textContent="فتح";open.className="pill";
   const del=document.createElement("button");del.className="del";del.textContent="حذف";del.onclick=async()=>{if(!confirm("هل تريد حذف سجل هذا الكتاب من المكتبة؟"))return;try{if(b.storageProvider==="firebase"&&b.storagePath)await deleteObject(ref(storage,b.storagePath));await deleteDoc(doc(db,"books",d.id));if(b.storageProvider==="cloudinary")alert("حُذف سجل الكتاب من Firestore فقط. احذف ملف Cloudinary من Media Library إذا أردت إزالته نهائياً.");await loadList()}catch(e){alert("تعذر الحذف: "+friendlyError(e))}};
   row.append(info,open,del);$("list").appendChild(row)
  })
 }catch(e){console.error(e);$("list").textContent="تعذر تحميل الكتب: "+friendlyError(e)}
}
if(ENABLE_FIREBASE_STORAGE){$("firebaseOption").disabled=false;$("providerHelp").textContent="Firebase Storage متاح بعد إعداد Blaze وStorage Rules."}
</script></body></html>
